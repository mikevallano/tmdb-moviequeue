name: CI

on:
  pull_request:
  push:
    branches: [master]

# Cancel superseded runs for the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan_ruby:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          cache-version: 1 # Increment this to clear cache if needed
      # Accepted warnings live in config/brakeman.ignore
      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

  scan_js:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          cache-version: 1 # Increment this to clear cache if needed
      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint_ruby:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          cache-version: 1 # Increment this to clear cache if needed
      # Existing offenses are baselined in .rubocop_todo.yml
      - name: Lint code for consistent style
        run: bundle exec rubocop --format github

  feature_specs:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine # matches production (Heroku Postgres 17)
        ports:
          - "5432:5432"
        env:
          POSTGRES_DB: rails_test
          POSTGRES_USER: rails
          POSTGRES_PASSWORD: password
    env:
      RAILS_ENV: test
      DATABASE_URL: "postgres://rails:password@localhost:5432/rails_test"
    steps:
      # Chrome is preinstalled on ubuntu-latest; selenium-webdriver fetches a
      # matching chromedriver via Selenium Manager.
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          cache-version: 1 # Increment this to clear cache if needed
      - name: Run feature specs
        env:
          # Set in repo Settings > Secrets and variables > Actions (and Dependabot)
          tmdb_api_key: ${{ secrets.TMDB_API_KEY }}
        run: bin/rails db:schema:load && bundle exec rspec spec/features

  ruby_specs:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine # matches production (Heroku Postgres 17)
        ports:
          - "5432:5432"
        env:
          POSTGRES_DB: rails_test
          POSTGRES_USER: rails
          POSTGRES_PASSWORD: password
    env:
      RAILS_ENV: test
      DATABASE_URL: "postgres://rails:password@localhost:5432/rails_test"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          cache-version: 1 # Increment this to clear cache if needed
      - name: Run backend tests (everything except feature specs)
        env:
          # Set in repo Settings > Secrets and variables > Actions (and Dependabot)
          tmdb_api_key: ${{ secrets.TMDB_API_KEY }}
        run: bin/rails db:schema:load && bundle exec rspec spec --tag ~@feature

  check_seeds:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine # matches production (Heroku Postgres 17)
        ports:
          - "5432:5432"
        env:
          POSTGRES_DB: rails_test
          POSTGRES_USER: rails
          POSTGRES_PASSWORD: password
    env:
      RAILS_ENV: test
      DATABASE_URL: "postgres://rails:password@localhost:5432/rails_test"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          cache-version: 1 # Increment this to clear cache if needed
      - name: Set up database schema
        run: bin/rails db:schema:load
      - name: Check Seeds
        run: bundle exec rake db:seed

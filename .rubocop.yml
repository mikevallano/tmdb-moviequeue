inherit_from: .rubocop_todo.yml

inherit_mode:
  merge:
    - Exclude

plugins:
  - rubocop-rails
  - rubocop-rspec

Style/Documentation:
  Enabled: false
AllCops:
  DefaultFormatter: progress
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - spec/rails_helper.rb
    - spec/spec_helper.rb
    - 'bin/**'
    - 'config/**/*'
    - 'db/**/*'
    - 'script/**/*'
Metrics/BlockLength:
  Exclude:
    - !ruby/regexp /.*_spec\.rb$/
Layout/LineLength:
  Max: 120
  Exclude:
    - 'spec/factories/**/*'
    - !ruby/regexp /.*_spec\.rb$/
Style/BlockDelimiters:
  Exclude:
    - !ruby/regexp /.*_spec\.rb$/
Style/EmptyMethod:
  EnforcedStyle: expanded
Style/NumericLiterals:
  Exclude:
    - !ruby/regexp /.*_spec\.rb$/
